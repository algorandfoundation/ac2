# OpenClaw + AC2 pairing stack.
#
# Services:
#   openclaw-gateway — the OpenClaw gateway (NOT published publicly; loopback only)
#   ac2-service      — the AC2 daemon (`ac2 service start --foreground`): owns
#                      the wallet connection (pairing, WebRTC, identity keystore,
#                      reconnect) and drives the agent over the gateway via the
#                      built-in `openclaw-gateway` runtime adapter. Shares the
#                      gateway's network namespace; its control socket lives on
#                      the ac2_home volume so the other containers can dial it.
#   pair-manager     — token-protected QR page driving `openclaw ac2 pair`,
#                      which is a thin client of ac2-service over that socket
#                      (shares the gateway's network namespace; reachable
#                      internally at openclaw-gateway:8377 and on the host
#                      at 127.0.0.1:8377)
#   caddy            — TLS-terminating reverse proxy (self-signed cert),
#                      fronted by Cloudflare in "Full" SSL mode
#                      OPTIONAL: only started when DOMAIN is set.
#                      Start with: docker compose --profile caddy up -d
#
# With caddy:    public surface is 80/443; pair page behind TLS + token.
# Without caddy: pair page is on http://localhost:8377 (loopback + token);
#                use an SSH tunnel for remote access.

services:
  openclaw-gateway:
    build:
      # Context is the monorepo root: the Dockerfile assembles the AC2 plugin
      # (and the ac2-cli service bundled inside it) from the monorepo source.
      context: ../..
      dockerfile: packages/ac2-open-claw-server/Dockerfile
      args:
        OPENCLAW_IMAGE: ${OPENCLAW_IMAGE:-ghcr.io/openclaw/openclaw:latest}
    image: openclaw-ac2:local
    command: ["node", "dist/index.js", "gateway"]
    restart: unless-stopped
    environment:
      HOME: /home/node
      OPENCLAW_DISABLE_BONJOUR: "1"
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:?set in .env}
      AC2_LIQUID_AUTH_SERVER: ${AC2_LIQUID_AUTH_SERVER:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GOOGLE_MODEL: ${GOOGLE_MODEL:-}
    volumes:
      - openclaw_data:/home/node/.openclaw
      # The AC2 plugin's tools (ac2_sign, ac2_capabilities, ac2_x402_fetch) run
      # inside the gateway process and dial the AC2 service's control socket.
      - ac2_home:/home/node/.ac2
    expose:
      # Pair page (served by pair-manager in this netns) — reached via caddy,
      # not published to the host.
      - "8377"
    ports:
      # Gateway/Control UI: host loopback only. Reach it via SSH tunnel.
      - "127.0.0.1:18789:18789"
      # Pair page: loopback only. Accessible directly when running without
      # caddy; caddy proxies to it internally (openclaw-gateway:8377) when
      # the caddy profile is active. pair-manager shares this network
      # namespace, so the port lives here.
      - "127.0.0.1:8377:8377"
    tmpfs:
      - /tmp:size=256m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:18789/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    # --- hardening ---
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512
    mem_limit: 2g
    cpus: "2.0"

  ac2-service:
    image: openclaw-ac2:local
    entrypoint: ["/bin/sh", "/app/ac2-service/entry.sh"]
    restart: unless-stopped
    depends_on:
      openclaw-gateway:
        condition: service_healthy
    # Share the gateway's network namespace so the `openclaw-gateway` runtime
    # adapter reaches the gateway on 127.0.0.1:18789.
    network_mode: "service:openclaw-gateway"
    environment:
      HOME: /home/node
      AC2_HOME: /home/node/.ac2
      # The daemon drives OpenClaw agent turns itself, over the gateway WS/RPC.
      AC2_RUNTIME: openclaw-gateway
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:?set in .env}
      AC2_LIQUID_AUTH_SERVER: ${AC2_LIQUID_AUTH_SERVER:-}
    volumes:
      # Persisted connections, identities, and openclaw.json (gateway discovery).
      - openclaw_data:/home/node/.openclaw
      # Control socket + pidfile, shared with the gateway and pair-manager.
      - ac2_home:/home/node/.ac2
    tmpfs:
      - /tmp:size=128m
    healthcheck:
      # The daemon is healthy when its control socket accepts connections.
      test: ["CMD", "node", "-e", "const s=require('net').connect(process.env.AC2_HOME+'/ac2d.sock');s.on('connect',()=>process.exit(0));s.on('error',()=>process.exit(1));setTimeout(()=>process.exit(1),3000)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    # --- hardening ---
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 1g
    cpus: "1.0"

  pair-manager:
    image: openclaw-ac2:local
    command: ["node", "/app/pair-manager/server.js"]
    restart: unless-stopped
    depends_on:
      ac2-service:
        condition: service_healthy
    # Share the gateway's network namespace: the pair page is reachable by
    # other containers at openclaw-gateway:8377 (caddy proxies to it; not
    # published to the host).
    network_mode: "service:openclaw-gateway"
    environment:
      HOME: /home/node
      AC2_HOME: /home/node/.ac2
      OPENCLAW_ENTRY: /app/dist/index.js
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:?set in .env}
      AC2_LIQUID_AUTH_SERVER: ${AC2_LIQUID_AUTH_SERVER:-}
      PAIR_SHOW_LOGS: ${PAIR_SHOW_LOGS:-}
      PAIR_TOKEN: ${PAIR_TOKEN:?set in .env}
      PAIR_PORT: "8377"
      PAIR_SESSION_TTL_MS: ${PAIR_SESSION_TTL_MS:-900000}
    volumes:
      - openclaw_data:/home/node/.openclaw
      # Control socket of ac2-service — `openclaw ac2 pair` dials it.
      - ac2_home:/home/node/.ac2
    tmpfs:
      - /tmp:size=128m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8377/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    # --- hardening ---
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 1g
    cpus: "1.0"

  caddy:
    profiles: ["caddy"]
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      pair-manager:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    # --- hardening ---
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    pids_limit: 128
    mem_limit: 256m
    cpus: "0.5"

volumes:
  # Named volume: initialized on first run from the image's /home/node/.openclaw,
  # which already contains the installed AC2 plugin (self-contained, with the
  # ac2-cli service and its native addons bundled) and the plugin/channel
  # wiring in openclaw.json. Also holds the AC2 service's persisted state
  # (connections, identities — AC2_STATE_DIR defaults to ~/.openclaw).
  openclaw_data:
  # AC2 service runtime dir (~/.ac2): control socket + pidfile, shared between
  # ac2-service (hosts it), the gateway (plugin tools) and pair-manager.
  ac2_home:
  # Persists Caddy's self-signed cert/key and internal CA so they survive
  # container restarts/rebuilds.
  caddy_data:
  caddy_config:
